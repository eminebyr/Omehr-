events {}
http {
  upstream omehr_streamlit {
    least_conn;
    server web1:8501;
    server web2:8501;
  }

  # bkz. docker-compose.production.yml — web1/web2'nin ikisi de
  # webhook_server.py'yi 8502'de çalıştırır.
  upstream omehr_webhook {
    least_conn;
    server web1:8502;
    server web2:8502;
  }

  server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    location /webhook/ {
      proxy_pass http://omehr_webhook;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://omehr_streamlit;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400;
    }
  }
}
