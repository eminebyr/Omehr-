events {}
http {
  # DÜZELTME (SaaS): önceki sürüm yalnız port 80 (düz HTTP) dinliyordu ve
  # docker-compose.yml'de HİÇBİR yere bağlı değildi (web1/web2 adında
  # servisler hiç yoktu — yetim/bağlı olmayan bir yapılandırmaydı).
  # Artık gerçek docker-compose.yml'deki tek "app" servisiyle eşleşiyor
  # ve 443 üzerinden TLS sonlandırma yapıyor; 80 yalnız 443'e yönlendirir.
  upstream basdas_streamlit {
    server app:8501;
  }

  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name _;
    client_max_body_size 100m;

    # DİKKAT: bu yollar bir sertifika sağlamaz — deploy/README_HTTPS.md'de
    # tarif edildiği gibi gerçek bir sertifika (Let's Encrypt/certbot veya
    # kurumsal CA) buraya bağlanmalıdır. Yerel/deneme kullanımı için
    # deploy/gecici_sertifika_uret.sh ile öz-imzalı bir sertifika üretilebilir.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://basdas_streamlit;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400;
    }
  }
}
