groups:
  - name: omehr
    rules:
      - alert: OmehrApplicationUnhealthy
        expr: omehr_health == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Omehr uygulaması sağlıksız"}
      - alert: OmehrLowDisk
        expr: omehr_disk_free_ratio < 0.10
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Omehr boş disk oranı %10 altında"}
      - alert: OmehrFailedJobs
        expr: omehr_jobs_total{status="FAILED"} > 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Başarısız arka plan görevi var"}
