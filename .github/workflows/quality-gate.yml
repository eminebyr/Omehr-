name: OMEHR Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: omehr-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Compile and architecture checks
        run: |
          python -m compileall -q .
          python tools/check_architecture.py

      - name: Full pytest suite
        run: pytest -q

      - name: Prepare isolated runtime
        run: |
          mkdir -p "$RUNNER_TEMP/omehr-runtime/input" "$RUNNER_TEMP/omehr-runtime/reference"
          cp input/OMEHR_AI_NORM_TRANSFER_INPUT.xlsx "$RUNNER_TEMP/omehr-runtime/input/"
          cp -a reference/. "$RUNNER_TEMP/omehr-runtime/reference/"

      - name: Thirty change scenarios
        env:
          OMEHR_RUNTIME_ROOT: ${{ runner.temp }}/omehr-runtime
          OMEHR_PREPARE_INPUT: "0"
        run: python tests/run_30_change_scenarios.py

      - name: Report contract
        run: |
          python - <<'PY'
          from services.report_contract import required_report_paths
          reports = required_report_paths(["B1", "B2", "B3", "B4", "B5", "B6"])
          assert len(reports) == 34, f"Beklenen 34 rapor, sözleşmede {len(reports)} var"
          assert len(reports) == len(set(reports)), "Rapor sözleşmesinde yinelenen yol var"
          PY
