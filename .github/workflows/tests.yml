name: verified-release
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Architecture, secrets, compile and isolated tests
        run: python tools/verify_release.py . --write-manifest V20_VERIFICATION.json
      - name: Build clean verified artifact
        run: python tools/build_clean_package.py . OMEHR_VERIFIED.zip --verify
      - uses: actions/upload-artifact@v4
        with:
          name: OMEHR-verified
          path: |
            OMEHR_VERIFIED.zip
            V20_VERIFICATION.json
