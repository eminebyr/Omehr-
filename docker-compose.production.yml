x-app: &app
  build: .
  env_file: [.env]
  environment:
    OMEHR_ISOLATED: "1"
    OMEHR_BOOTSTRAP_RUNTIME: "1"
    OMEHR_RUNTIME_ROOT: /runtime
    OMEHR_RUN_ENGINE_ON_START: "0"
  volumes:
    - ${OMEHR_TENANT_DATA:-./tenant_data/OMEHR}:/runtime
  restart: unless-stopped

services:
  init:
    <<: *app
    command: ["python", "deployment_init.py"]
    restart: "no"
  web1:
    <<: *app
    command: ["python", "container_entrypoint.py"]
    depends_on: {init: {condition: service_completed_successfully}}
  web2:
    <<: *app
    command: ["python", "container_entrypoint.py"]
    depends_on: {init: {condition: service_completed_successfully}}
  worker:
    <<: *app
    command: ["python", "worker.py"]
    depends_on: {init: {condition: service_completed_successfully}}
  monitor:
    <<: *app
    command: ["uvicorn", "monitoring_server:app", "--host", "0.0.0.0", "--port", "9108"]
    depends_on: {init: {condition: service_completed_successfully}}
  alert-watcher:
    <<: *app
    command: ["python", "alert_watcher.py"]
    depends_on: {init: {condition: service_completed_successfully}}
  nginx:
    image: nginx:1.27-alpine
    ports: ["${OMEHR_PORT:-8501}:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [web1, web2, monitor]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on: [monitor, alertmanager]
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped
  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./deploy/loki.yml:/etc/loki/local-config.yaml:ro
    restart: unless-stopped
  promtail:
    image: grafana/promtail:3.4.2
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./deploy/promtail.yml:/etc/promtail/config.yml:ro
      - ${OMEHR_TENANT_DATA:-./tenant_data/OMEHR}:/runtime:ro
    depends_on: [loki]
    restart: unless-stopped
